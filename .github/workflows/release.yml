# main への push で Changesets を実行する。
# - changeset があれば、GitHub App の名義でリリース PR を作成・更新する（App の名義なので PR で CI が動く）
# - changeset がなく未公開のバージョンがあれば、npm の trusted publishing（OIDC）で公開し、タグと GitHub Release を作る
# npm への公開は、人がリリース PR をマージしたときだけ起きる（エージェントは公開しない）。
# 事前に人が行う設定（GitHub Environment・GitHub App・npm の trusted publisher）は docs/release.md を参照。
#
# 安全のための設計
# - ジョブは Environment「release」で動く。Environment は main だけに制限し、npm の trusted publisher と
#   App の秘密鍵も Environment に結びつける。作業ブランチでこのファイルを書き換えても、公開も秘密鍵の取得もできない
# - 標準トークンは読み取りと OIDC だけ。書き込み（push・PR・タグ・Release）は GitHub App のトークンで行う
# - App のトークンは changesets/action の直前に発行し、.git/config には残さない（persist-credentials: false）
# - actions はコミット SHA で固定する（コメントのバージョンは参照用）
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ludy-kida/note-blog-kit'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # registry-url は付けない（認証は trusted publishing に任せ、ダミーのトークンを .npmrc に書かない）。
      # 公開するジョブなので依存のキャッシュは使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: npm が trusted publishing に対応しているか確認（11.5.1 以上）
        run: |
          version="$(npm --version)"
          echo "npm $version"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$version" \
            || { echo "npm 11.5.1 以上が必要です（現在 $version）"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: GitHub App のトークンを発行
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # push・コミット・タグは GitHub API（github-token）で行うため、git の認証情報は不要
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm exec changeset version
          publish-script: pnpm exec changeset publish
          pr-title: "chore: release"
          commit-message: "chore: release"
          create-github-releases: true
